<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Expertise"><style>
.f{animation:fadeup .9s cubic-bezier(.2,.7,.2,1) both}
.c{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both, wave 5s ease-in-out 2.6s infinite}
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.d{stroke-dasharray:1200;animation:draw 1.6s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes wave{0%,70%,100%{opacity:1}35%{opacity:.5}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1280" height="400" fill="#0d1117"/><text x="64" y="64" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2.5" fill="#656d76" text-anchor="start">EXPERTISE</text><line class="d" x1="178" y1="60" x2="1216" y2="60" stroke="#2a3038"/><g class="f" style="animation-delay:0.15s"><rect class="g" style="animation-delay:0.40s" x="64" y="104" width="28" height="4" fill="#d95b3a"/><text x="104" y="110" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#656d76" text-anchor="start">01</text><text font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e6edf3"><tspan x="64" y="160">Urban heat and</tspan><tspan x="64" y="194">thermal comfort</tspan></text><text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1"><tspan x="64" y="236">UTCI, WBGT and mean radiant</tspan><tspan x="64" y="259">temperature, from decades of city</tspan><tspan x="64" y="282">trends down to street-level</tspan><tspan x="64" y="305">exposure.</tspan></text><text x="64" y="348" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#656d76" text-anchor="start">UTCI · MRT · ENVI-MET</text></g><g class="f" style="animation-delay:0.37s"><rect class="g" style="animation-delay:0.62s" x="360" y="104" width="28" height="4" fill="#f3cf6a"/><text x="400" y="110" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#656d76" text-anchor="start">02</text><text font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e6edf3"><tspan x="360" y="160">Earth observation</tspan><tspan x="360" y="194">and downscaling</tspan></text><text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1"><tspan x="360" y="236">Reanalysis downscaled to 10 m</tspan><tspan x="360" y="259">with Random Forest on Sentinel,</tspan><tspan x="360" y="282">MODIS and building data in Earth</tspan><tspan x="360" y="305">Engine.</tspan></text><text x="360" y="348" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#656d76" text-anchor="start">GEE · RANDOM FOREST ·</text><text x="360" y="366" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#656d76" text-anchor="start">SENTINEL-2 · S5P</text></g><g class="f" style="animation-delay:0.59s"><rect class="g" style="animation-delay:0.84s" x="656" y="104" width="28" height="4" fill="#5a86cf"/><text x="696" y="110" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#656d76" text-anchor="start">03</text><text font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e6edf3"><tspan x="656" y="160">Climate data</tspan><tspan x="656" y="194">analysis</tspan></text><text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1"><tspan x="656" y="236">Hourly ERA5-Land over 46 years,</tspan><tspan x="656" y="259">trend testing, extreme-day</tspan><tspan x="656" y="282">statistics and WRF runs on HPC.</tspan></text><text x="656" y="348" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#656d76" text-anchor="start">ERA5-LAND · WRF · PYTHON</text></g><g class="f" style="animation-delay:0.81s"><rect class="g" style="animation-delay:1.06s" x="952" y="104" width="28" height="4" fill="#a9d4a0"/><text x="992" y="110" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#656d76" text-anchor="start">04</text><text font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#e6edf3"><tspan x="952" y="160">Field sensing</tspan><tspan x="952" y="194">and perception</tspan></text><text font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1"><tspan x="952" y="236">Wearable sensor campaigns paired</tspan><tspan x="952" y="259">with surveys of thermal, air</tspan><tspan x="952" y="282">quality and acoustic comfort.</tspan></text><text x="952" y="348" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.6" fill="#656d76" text-anchor="start">WEARABLES · SURVEYS</text></g></svg>