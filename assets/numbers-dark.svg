<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="In numbers: 10 m UTCI heat maps, 100 m air quality maps, 46 years of hourly data, 3 European cities, 7 languages spoken"><style>
.f{animation:fadeup .9s cubic-bezier(.2,.7,.2,1) both}
.c{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.4,.5,1) both, wave 5s ease-in-out 2.6s infinite}
.g{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
.d{stroke-dasharray:1200;animation:draw 1.6s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes wave{0%,70%,100%{opacity:1}35%{opacity:.5}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="1280" height="250" fill="#0d1117"/><text x="64" y="64" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2.5" fill="#656d76" text-anchor="start">IN NUMBERS</text><line class="d" x1="188" y1="60" x2="1216" y2="60" stroke="#2a3038"/><g class="f" style="animation-delay:0.20s"><text x="64" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#e6edf3" letter-spacing="-1">10 m</text><rect class="g" style="animation-delay:0.50s" x="66" y="182" width="36" height="3" fill="#d95b3a"/><text x="66" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9198a1">UTCI heat maps</text></g><g class="f" style="animation-delay:0.38s"><text x="300" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#e6edf3" letter-spacing="-1">100 m</text><rect class="g" style="animation-delay:0.68s" x="302" y="182" width="36" height="3" fill="#f3cf6a"/><text x="302" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9198a1">air quality maps</text></g><g class="f" style="animation-delay:0.56s"><text x="570" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#e6edf3" letter-spacing="-1">46</text><rect class="g" style="animation-delay:0.86s" x="572" y="182" width="36" height="3" fill="#5a86cf"/><text x="572" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9198a1">years of hourly data</text></g><g class="f" style="animation-delay:0.74s"><text x="810" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#e6edf3" letter-spacing="-1">3</text><rect class="g" style="animation-delay:1.04s" x="812" y="182" width="36" height="3" fill="#a9d4a0"/><text x="812" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9198a1">European cities</text></g><g class="f" style="animation-delay:0.92s"><text x="1030" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#e6edf3" letter-spacing="-1">7</text><rect class="g" style="animation-delay:1.22s" x="1032" y="182" width="36" height="3" fill="#9e2229"/><text x="1032" y="214" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9198a1">languages spoken</text></g></svg>